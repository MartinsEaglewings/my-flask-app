<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Available Tasks</title>
</head>
<body>
    <div class="container">
        <h2>Available Tasks</h2>
        {% for task in tasks %}
        <div class="card">
            <h3>{{ task.title }}</h3>
            <p>{{ task.description }}</p>
            <p><strong>Reward:</strong> ${{ "%.2f"|format(task.reward_amount) }}</p>
            
            {% if task.submission_status == 'approved' %}
                <button disabled style="background:var(--success)">Completed</button>
            {% elif task.submission_status == 'pending' %}
                <button disabled style="background:var(--border)">Under Review</button>
            {% else %}
                <form method="POST">
                    <input type="hidden" name="task_id" value="{{ task.id }}">
                    <textarea name="proof" placeholder="Enter completion proof..." required></textarea>
                    <button type="submit">Submit Task</button>
                </form>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <nav class="bottom-nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/tasks" class="active">Tasks</a>
        <a href="/withdrawals">Withdraw</a>
        <a href="/logout">Logout</a>
    </nav>
</body>
</html>
