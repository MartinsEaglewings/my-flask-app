<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Login</title>
</head>
<body>
    <div class="container">
        <h2>Welcome Back</h2>
        {% if error %}
            <div class="card" style="background:#450a0a; color:#fca5a5; margin-bottom:12px; padding:10px;">
                {{ error }}
            </div>
        {% endif %}
        <form method="POST" action="/login">
            <label style="display:block; margin-bottom:5px;">Username</label>
            <input type="text" name="username" required style="width:100%; padding:8px; margin-bottom:12px;">
            
            <label style="display:block; margin-bottom:5px;">Password</label>
            <input type="password" name="password" required style="width:100%; padding:8px; margin-bottom:12px;">

            <button type="submit" style="width:100%; padding:10px;">Log In</button>
        </form>
        <p style="margin-top:15px; text-align:center;">
            Don't have an account? <a href="/signup">Sign up</a>
        </p>

        <div style="position:fixed; bottom:5px; right:5px;">
            <a href="/admin/login" style="color:transparent; font-size:8px; text-decoration:none; opacity:0.1;">.</a>
        </div>
    </div>
</body>
</html>
