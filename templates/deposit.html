<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Deposit Funds</title>
</head>
<body style="background-color: #0f172a; color: #fff; font-family: sans-serif;">
    <div class="container" style="padding: 20px; max-width: 500px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: #fff; margin: 0;">Deposit Funds</h2>
            <a href="/tasks" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">← Tasks</a>
        </div>

        <!-- Account Display Card -->
        <div class="card" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #065f46 100%); padding: 25px; border-radius: 16px; margin-bottom: 25px; border: 1px solid #10b981; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.25);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="background: #10b981; color: #000; font-weight: bold; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; text-transform: uppercase;">Bank Transfer</span>
            </div>

            <div style="margin-bottom: 12px;">
                <small style="color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 2px;">Bank Name</small>
                <div style="font-size: 1.2rem; font-weight: bold; color: #ffffff;">OPay</div>
            </div>

            <div style="margin-bottom: 20px;">
                <small style="color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 2px;">Account Number</small>
                <div style="font-size: 1.8rem; font-weight: 800; color: #10b981; letter-spacing: 2px;" id="accNo">9068053574</div>
            </div>

            <button onclick="copyNumber()" id="copyBtn" style="width: 100%; background: #10b981; color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s;">
                📋 Copy Account Number
            </button>
        </div>
    </div>

    <script>
    function copyNumber() {
        const num = "9068053574";
        navigator.clipboard.writeText(num).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "✓ Account Number Copied!";
            btn.style.background = "#fbbf24";
            setTimeout(() => {
                btn.innerText = "📋 Copy Account Number";
                btn.style.background = "#10b981";
            }, 2500);
        });
    }
    </script>
</body>
</html>
