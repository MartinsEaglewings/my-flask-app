<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Tasks</title>
</head>
<body style="background-color: #0f172a; color: #fff; font-family: sans-serif;">
    <div class="container" style="padding: 20px; max-width: 600px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Available Tasks</h2>
            <a href="/dashboard" style="color: #94a3b8; text-decoration: none;">← Dashboard</a>
        </div>

        <!-- Deposit Task Card with Direct OPay Launch -->
        <div class="card" style="background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #10b981;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="margin: 0 0 5px 0;">Deposit Funds</h3>
                    <p style="margin: 0; color: #94a3b8; font-size: 0.85rem;">Bank: OPay | Account Number: 9068053574</p>
                </div>
                <button onclick="handleOpayDeposit(this)" style="background: #10b981; color: #000; font-weight: bold; padding: 8px 18px; border-radius: 6px; border: none; cursor: pointer; white-space: nowrap; transition: all 0.2s;">
                    Copy & Open OPay
                </button>
            </div>
        </div>

        <!-- Dynamic Tasks List -->
        {% for task in tasks %}
        <div class="card" style="background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="margin: 0 0 5px 0;">{{ task.title }}</h3>
                    <p style="margin: 0 0 5px 0; color: #94a3b8; font-size: 0.85rem;">{{ task.description }}</p>
                    <span style="color: #22c55e; font-weight: bold;">Reward: ${{ "%.2f"|format(task.reward_amount) }}</span>
                </div>
                <a href="/tasks/{{ task.id }}" style="background: #3b82f6; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none;">Start</a>
            </div>
        </div>
        {% else %}
        <p style="color: #94a3b8;">No tasks available right now.</p>
        {% endfor %}
    </div>

    <script>
    function handleOpayDeposit(btn) {
        const accountNumber = "9068053574";
        
        // 1. Copy account number to clipboard securely
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(accountNumber);
        } else {
            let textArea = document.createElement("textarea");
            textArea.value = accountNumber;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand('copy');
            textArea.remove();
        }

        // 2. UI Feedback
        btn.innerText = "Copied! Opening OPay...";
        btn.style.background = "#fbbf24";

        // 3. Android Intent for OPay app package
        const opayIntent = "intent://#Intent;scheme=android-app;package=team.opay.pay;S.browser_fallback_url=https://play.google.com/store/apps/details?id=team.opay.pay;end";
        
        // Launch app after short delay for clipboard sync
        setTimeout(() => {
            window.location.href = opayIntent;
            btn.innerText = "Copy & Open OPay";
            btn.style.background = "#10b981";
        }, 500);
    }
    </script>
</body>
</html>
