<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 2rem; }
        .card { background: #1e293b; padding: 2rem; border-radius: 8px; max-width: 500px; margin: 0 auto; }
        a.btn { display: inline-block; padding: 10px 15px; background: #ef4444; color: white; text-decoration: none; border-radius: 4px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome, {{ username }}!</h1>
        <p>You have successfully logged in to your account.</p>
        <a href="/logout" class="btn">Logout</a>
    </div>
</body>
</html>
