<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 8px; width: 300px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        a { color: #60a5fa; text-decoration: none; font-size: 0.9rem; }
        .flash { color: #f87171; font-size: 0.85rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST" action="/signup">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="/login">Login</a></p>
    </div>
</body>
</html>
